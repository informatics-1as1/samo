<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الإعلام الآلي: الأحمر ضد الأزرق</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5fa;--card:#fff;--text:#1c1f2b;--muted:#6b7084;--border:#d9dcea;--red:#d93a3a;--blue:#2f6fe0;--ok:#1f9d55;--bad:#d93a3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141c;--card:#1d2030;--text:#eef0f8;--muted:#a0a5bd;--border:#33384f;--red:#f05a5a;--blue:#5b92f5;--ok:#3ec97c;--bad:#f05a5a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141c;--card:#1d2030;--text:#eef0f8;--muted:#a0a5bd;--border:#33384f;--red:#f05a5a;--blue:#5b92f5;--ok:#3ec97c;--bad:#f05a5a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;text-align:center;margin:8px 0 14px}
.scores{display:flex;gap:10px;margin-bottom:14px}
.team{flex:1;background:var(--card);border:3px solid var(--border);border-radius:14px;padding:10px;text-align:center;transition:.2s}
.team b{display:block;font-size:.95rem}
.team span{font-size:1.8rem;font-weight:700}
.team.red{color:var(--red)}.team.blue{color:var(--blue)}
.team.red.active{border-color:var(--red)}.team.blue.active{border-color:var(--blue)}
.team.active{transform:scale(1.03)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.turn{text-align:center;font-weight:700;margin-bottom:6px}
.turn.red{color:var(--red)}.turn.blue{color:var(--blue)}
.count{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:10px}
.q{font-size:1.1rem;font-weight:700;margin-bottom:14px}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--text);border:2px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;font:inherit;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.msg{text-align:center;font-weight:700;min-height:1.6em;margin:4px 0 8px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;color:#fff;background:var(--blue);cursor:pointer}
.hide{display:none}
.end{text-align:center}
.end h2{font-size:1.5rem;margin:6px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>🎯 تحدي الإعلام الآلي</h1>
<div class="scores">
<div class="team red" id="tr"><b>🔴 الفريق الأحمر</b><span id="sr">0</span></div>
<div class="team blue" id="tb"><b>🔵 الفريق الأزرق</b><span id="sb">0</span></div>
</div>
<div class="card" id="game">
<div class="turn" id="turn"></div>
<div class="count" id="count"></div>
<div class="q" id="q"></div>
<div id="opts"></div>
<div class="msg" id="msg"></div>
<button class="btn hide" id="next">السؤال التالي</button>
</div>
<div class="card end hide" id="end">
<div style="font-size:3rem">🏆</div>
<h2 id="winner"></h2>
<p id="final"></p>
<button class="btn" id="again">العب من جديد</button>
</div>
</div>
<script>
var Q=[
["ما هو الجزء المسؤول عن معالجة البيانات في الحاسوب؟",["المعالج (CPU)","الشاشة","الفأرة","الطابعة"]],
["أي من التالي يُعتبر وحدة إدخال؟",["لوحة المفاتيح","الشاشة","الطابعة","السماعات"]],
["أي من التالي يُعتبر وحدة إخراج؟",["الطابعة","الفأرة","الماسح الضوئي","الميكروفون"]],
["أي من التالي هو نظام تشغيل؟",["Windows","Word","Chrome","Excel"]],
["ما اختصار لوحة المفاتيح المستخدم لنسخ العنصر المحدد؟",["Ctrl + C","Ctrl + V","Ctrl + X","Ctrl + Z"]],
["أي برنامج يُستخدم لمعالجة النصوص؟",["Word","Excel","Paint","Calculator"]],
["أي برنامج يُستخدم لإنشاء الجداول الحسابية؟",["Excel","Word","Paint","Notepad"]],
["أي وحدة من التالي هي الأكبر في قياس سعة التخزين؟",["غيغابايت","ميغابايت","كيلوبايت","بايت"]],
["كم بتًّا (bit) يحتوي البايت الواحد؟",["8","2","4","16"]],
["أي ذاكرة تفقد محتوياتها عند إطفاء الجهاز؟",["الذاكرة العشوائية RAM","القرص الصلب","فلاش USB","القرص المضغوط"]],
["أي من التالي يُعتبر متصفح إنترنت؟",["Google Chrome","Windows","Photoshop","PowerPoint"]],
["ما هو الفيروس المعلوماتي؟",["برنامج ضار يضر بالجهاز والملفات","جهاز لتبريد الحاسوب","برنامج لتسريع الإنترنت","نوع من الطابعات"]],
["ما النظام العددي الذي يعتمد عليه الحاسوب داخليًّا؟",["النظام الثنائي (0 و 1)","النظام العشري فقط","النظام الروماني","النظام الستيني"]],
["ما الامتداد الشائع لملفات الصور؟",[".jpg",".mp3",".docx",".exe"]]
];
var teams=["red","blue"],names={red:"الفريق الأحمر 🔴",blue:"الفريق الأزرق 🔵"};
var $=function(i){return document.getElementById(i)};
var order,idx,score,locked;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){
 order=shuffle(Q.map(function(_,i){return i})).slice(0,12);
 idx=0;score={red:0,blue:0};
 $("end").classList.add("hide");$("game").classList.remove("hide");
 show();
}
function show(){
 locked=false;
 var t=teams[idx%2];
 $("sr").textContent=score.red;$("sb").textContent=score.blue;
 $("tr").classList.toggle("active",t==="red");$("tb").classList.toggle("active",t==="blue");
 $("turn").textContent="الدور على "+names[t];$("turn").className="turn "+t;
 $("count").textContent="السؤال "+(idx+1)+" من "+order.length;
 var item=Q[order[idx]];
 $("q").textContent=item[0];
 $("msg").textContent="";$("next").classList.add("hide");
 var box=$("opts");box.innerHTML="";
 var opts=shuffle(item[1].map(function(x,i){return{t:x,c:i===0}}));
 opts.forEach(function(o){
  var b=document.createElement("button");b.className="opt";b.textContent=o.t;
  b.onclick=function(){pick(b,o,opts,t)};box.appendChild(b);
 });
}
function pick(btn,o,opts,t){
 if(locked)return;locked=true;
 var all=document.querySelectorAll(".opt");
 all.forEach(function(b,i){if(opts[i].c)b.classList.add("ok")});
 if(o.c){score[t]++;$("msg").textContent="✅ إجابة صحيحة! نقطة لـ"+names[t]}
 else{btn.classList.add("bad");$("msg").textContent="❌ إجابة خاطئة، لا توجد نقطة"}
 $("sr").textContent=score.red;$("sb").textContent=score.blue;
 $("next").textContent=idx+1<order.length?"السؤال التالي":"عرض النتيجة";
 $("next").classList.remove("hide");
}
$("next").onclick=function(){idx++;if(idx<order.length)show();else finish()};
function finish(){
 $("game").classList.add("hide");$("end").classList.remove("hide");
 var r=score.red,b=score.blue;
 $("winner").textContent=r===b?"تعادل! 🤝":"الفائز: "+(r>b?names.red:names.blue);
 $("final").textContent="الأحمر "+r+" — الأزرق "+b;
}
$("again").onclick=start;
start();
</script>
</body>
</html>
